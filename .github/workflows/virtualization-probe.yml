name: One-time G2B shopping API probe
on:
  push:
    paths:
      - .github/workflows/virtualization-probe.yml
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/fix/virtualization-procurement-2024-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check official shopping details API (read only)
        run: |
          set -eu
          url="https://oksp-pipeline-radar-enrb5z68y-jaebok-oh-s-projects.vercel.app/api/probe-virtualization-shopping"
          for i in $(seq 1 20); do
            code="$(curl --silent --show-error --location --max-time 90 --output probe.json --write-out '%{http_code}' "$url")"
            if [ "$code" = "200" ]; then
              echo "Response from preview:"
              if jq -e 'type == "object"' probe.json > /dev/null 2>&1; then
                jq '{ok,responses:[.responses[]? | {month,keyword,ok,status,code,totalCount,error,items}]}' probe.json
              else
                echo "Non-JSON response, first bytes:"
                head -c 450 probe.json | tr '\\n' ' '
                echo
              fi
              exit 0
            fi
            echo "Preview not ready (HTTP $code, attempt $i)"
            sleep 8
          done
          echo "No successful preview response" >&2
          exit 1
