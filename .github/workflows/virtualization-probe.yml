name: Signed G2B historical backfill pilot
on:
  push:
    paths:
      - .github/workflows/virtualization-probe.yml
permissions:
  contents: read
  id-token: write
jobs:
  pilot:
    if: github.ref == 'refs/heads/fix/virtualization-procurement-2024-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Validate signed one-month read-only collection
        env:
          BASE_URL: https://oksp-pipeline-radar-git-fix-virtual-fba162-jaebok-oh-s-projects.vercel.app
        run: |
          set -euo pipefail
          endpoint="$BASE_URL/api/verified-g2b-backfill"
          for i in $(seq 1 32); do
            code="$(curl --silent --show-error --max-time 20 --output /tmp/route.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$endpoint")"
            if [ "$code" = 401 ]; then echo "Protected endpoint ready"; break; fi
            echo "Endpoint not ready (HTTP $code, $i/32)"
            sleep 8
          done
          if [ "$code" != "401" ]; then echo "Protected endpoint unavailable"; exit 1; fi
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=oksp-pipeline-radar-virtualization-2024-2026"
          jwt="$(curl --silent --show-error --fail --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" | jq -r '.value')"
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then echo "GitHub identity token unavailable"; exit 1; fi
          code="$(curl --silent --show-error --max-time 280 --output result.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -d '{"year":2025,"month":2,"persist":false}' "$endpoint")"
          echo "HTTP $code"
          jq '{ok,year,month,persist,requestCount,fetchedCount,verifiedCount,dedupedCount,failedTaskCount,companyCounts,errors,preview,error}' result.json
          test "$code" = 200
