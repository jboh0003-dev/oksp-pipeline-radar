name: Signed virtualization tender discovery pilot
on:
  push:
    paths:
      - .github/workflows/virtualization-probe.yml
permissions:
  contents: read
  id-token: write
jobs:
  pilot:
    if: github.ref == 'refs/heads/fix/virtualization-procurement-2024-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify keyword tender discovery before committing data
        run: |
          set -euo pipefail
          endpoint="https://oksp-pipeline-radar-231wvyqkc-jaebok-oh-s-projects.vercel.app/api/verified-g2b-candidates"
          code="$(curl -sS --max-time 20 -o /tmp/unauth.json -w '%{http_code}' -X POST -d '{}' "$endpoint")"
          echo "Unauthenticated access: HTTP $code"
          test "$code" = 401
          identity_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=oksp-pipeline-radar-virtualization-2024-2026"
          jwt="$(curl -fsS --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$identity_url" | jq -r '.value')"
          code="$(curl -sS --max-time 240 -o result.json -w '%{http_code}' -X POST -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -d '{"year":2025,"month":2,"persist":false}' "$endpoint")"
          echo "HTTP $code"
          jq '{ok,year,month,requestCount,fetchedCount,excludedCount,matchedCount,withNamedBrand,errors,error,samples}' result.json
          test "$code" = 200
