name: Retry the three failed 2024 virtualization opening months
on:
  push:
    paths:
      - .github/workflows/virtualization-probe.yml
permissions:
  contents: read
  id-token: write
jobs:
  retry:
    if: github.ref == 'refs/heads/fix/virtualization-procurement-2024-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Sequentially retry only failed months using lower source concurrency
        run: |
          set -euo pipefail
          endpoint="https://oksp-pipeline-radar-msmotvce7-jaebok-oh-s-projects.vercel.app/api/verified-g2b-candidates"
          code=0
          for i in $(seq 1 50); do
            code="$(curl -sS --max-time 20 -o /tmp/probe.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$endpoint")"
            if [ "$code" = "401" ]; then echo "Updated signed endpoint ready"; break; fi
            echo "Waiting for compiled preview ($code, $i/50)"
            sleep 7
          done
          test "$code" = 401
          failed=0
          for month in 1 6 7; do
            identity_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=oksp-pipeline-radar-virtualization-2024-2026"
            jwt="$(curl -fsS --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$identity_url" | jq -r '.value')"
            payload="$(printf '{"year":2024,"month":%s,"persist":true}' "$month")"
            code="$(curl -sS --max-time 290 -o /tmp/response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $jwt" -H "Content-Type: application/json" -d "$payload" "$endpoint")"
            jq -c '{year,month,ok,requestCount,fetchedCount,matchedCount,insertedCount,updatedCount,errors,error}' /tmp/response.json || true
            status="$(jq -r '.ok==true and (.errors|length)==0' /tmp/response.json 2>/dev/null || echo false)"
            if [ "$code" != "200" ] || [ "$status" != "true" ]; then
              echo "FAILED 2024/$month"
              failed=$((failed+1))
            else
              echo "PASSED 2024/$month"
            fi
            sleep 2
          done
          echo "RETRY_2024_STATUS failed_months=$failed"
          test "$failed" -eq 0
